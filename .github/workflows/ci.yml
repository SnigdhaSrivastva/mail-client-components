name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install workspace
        run: uv sync --all-packages --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest src/ -m "not local_credentials and not integration" --cov=src --cov-report=term
      - name: Type check
        run: uv run mypy src/ --explicit-package-bases
